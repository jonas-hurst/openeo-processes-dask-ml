[project]
name = "openeo-processes-dask-ml"
version = "0.0.4"
description = "Implementation for openEO ML processes, built to extend openeo-processes-dask"
authors = [{ name = "Jonas Hurst", email = "jhurst@uni-muenster.de" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.38.14",
    "stackstac>=0.5.1",
    "brotli>=1.2.0",
    "openeo-processes-dask[implementations] (>=2026.6.4,<2027.0.0)",
    "pystac @ git+https://github.com/jonas-hurst/pystac@v1.15.1OWN",
    "gdal (==3.13.1)",
    "zarr (>3.0)",
    "s3fs (>=2026.7.0,<2027.0.0)",
]

[project.optional-dependencies]
torch-cuda = ["torch==2.9.0"]
torch-cpu = ["torch==2.9.0"]
scikit-learn = ["scikit-learn>=1.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-recording>=0.13.4,<0.14.0",
    "matplotlib>=3.10.3,<4.0.0",
    "black>=25.1.0,<26.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "notebook>=7.4.4,<8.0.0",
    "graphviz>=0.21,<1.0.0",
    "dask-labextension>=7.0.0,<8.0.0",
    "dask-jobqueue>=0.9.0,<0.10.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "types-geopandas>=1.1.4.20260807",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openeo_processes_dask_ml"
module-root = ""

[tool.pytest.ini_options]
addopts = "--block-network --record-mode=new_episodes --cov=openeo_processes_dask_ml --cov=minibackend --cov-report=html"

[tool.uv]
# torch-cuda (PyPI) and torch-cpu can't coexist in one resolution
conflicts = [
    [
        { extra = "torch-cuda" },
        { extra = "torch-cpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true                     # only used for packages that reference it

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
]
